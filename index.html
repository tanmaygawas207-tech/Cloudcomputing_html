<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: black;
            font-size: 20px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <p>This is my first website using HTML and CSS.</p>

    <button>Click Me</button>

</body>
</html>
